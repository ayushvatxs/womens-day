<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Women's Day!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffe6ea 0%, #fdfbfb 100%);
            color: #333;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            opacity: 0;
            animation: fadeIn 2s ease-in forwards;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #d81b60;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            font-size: 1.5rem;
            color: #ff4081;
            opacity: 0;
            animation: floatUp 4s linear infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Photo Gallery */
        .gallery-container {
            padding: 50px 20px;
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .gallery-container h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #c2185b;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 20px rgba(0,0,0,0.2);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            background-color: #fff;
            color: #888;
            font-size: 0.9rem;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .hero p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <section class="hero">
        <h1>Happy Women's Day!</h1>
        <p>To the most incredible, beautiful, and inspiring woman I know. Your strength, your kindness, and your smile make every day brighter. Today is all about celebrating you!</p>
    </section>

    <section class="gallery-container">
        <h2>My Favorite Views</h2>
        <div class="gallery">
            <img src="pic1.jpg" alt="A beautiful picture of her">
            <img src="pic2.jpg" alt="Another cute moment">
            <img src="pic3.jpg" alt="Love">
            <img src="pic4.jpg" alt="Her stunning smile">
        </div>
    </section>

    <footer>
        <p>Made with ❤️ just for you.</p>
    </footer>

    <script>
        // Script to generate floating hearts in the background
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's'; // Between 3-5 seconds
            
            document.getElementById('hearts-container').appendChild(heart);

            // Remove heart after it floats up to prevent memory leaks
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 300);
    </script>
</body>
</html>
